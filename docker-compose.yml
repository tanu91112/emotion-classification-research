version: '3.8'

services:
  emotion-api:
    build: .
    container_name: emotion-classification-api
    ports:
      - "8000:8000"
      - "5000:5000"
    volumes:
      - ./models:/app/models
      - ./mlflow_runs:/app/mlflow_runs
      - ./logs:/app/logs
    environment:
      - MLFLOW_TRACKING_URI=file:/app/mlflow_runs
    command: python -m src.deploy

  mlflow-ui:
    build: .
    container_name: mlflow-ui
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_runs:/app/mlflow_runs
    environment:
      - MLFLOW_TRACKING_URI=file:/app/mlflow_runs
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri file:/app/mlflow_runs